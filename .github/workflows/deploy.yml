# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — Marketing Dashboard
# Build → Push to IBM Container Registry → Deploy to IBM Code Engine
# ─────────────────────────────────────────────────────────────────────────────
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   IBM_CLOUD_API_KEY       - IBM Cloud API key (IAM)
#   ICR_NAMESPACE           - IBM Container Registry namespace
#                             e.g. "my-org-namespace"
#   CE_PROJECT_ID           - Code Engine project ID (GUID)
#   CE_APP_NAME             - Code Engine application name
#                             e.g. "marketing-dashboard"
#   CE_REGION               - IBM Cloud region, e.g. "us-south"
#   CE_RESOURCE_GROUP       - IBM Cloud resource group name
#                             e.g. "itz-wxo-6a38d777316a5cae0b274f"
#   WATSONX_API_KEY         - watsonx.ai API key (injected at runtime)
#   WATSONX_PROJECT_ID      - watsonx.ai project ID
#   WATSONX_URL             - watsonx.ai endpoint URL
#   WATSONX_MODEL_ID        - Model ID, e.g. "openai/gpt-oss-120b"
#
# Optional — change these env vars to match your setup:
#   ICR_REGION              - Container Registry region (default: us.icr.io)
# ─────────────────────────────────────────────────────────────────────────────

name: Build and Deploy to IBM Code Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ICR_REGION: us.icr.io
  IMAGE_NAME: marketing-dashboard

jobs:
  # ── 1. Lint & test ──────────────────────────────────────────────────────────
  test:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts (smoke test)
        env:
          PORT: 3001
          WATSONX_API_KEY: placeholder
          WATSONX_PROJECT_ID: placeholder
          WATSONX_URL: https://placeholder.ml.cloud.ibm.com
          WATSONX_MODEL_ID: placeholder
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:3001/ || (echo "Server did not start!" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "✅ Smoke test passed"

  # ── 2. Build & push Docker image ────────────────────────────────────────────
  build-push:
    name: Build & Push to ICR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ICR_REGION }}/${{ secrets.ICR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to IBM Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ICR_REGION }}
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ICR_REGION }}/${{ secrets.ICR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.ICR_REGION }}/${{ secrets.ICR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to IBM Code Engine ────────────────────────────────────────────
  deploy:
    name: Deploy to IBM Code Engine
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Install IBM Cloud CLI + plugins
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f
          ibmcloud plugin install container-registry -f

      - name: Login to IBM Cloud
        run: |
          ibmcloud login --apikey "${{ secrets.IBM_CLOUD_API_KEY }}" \
            -r "${{ secrets.CE_REGION }}" \
            -g "${{ secrets.CE_RESOURCE_GROUP }}"

      - name: Target Code Engine project
        run: |
          ibmcloud ce project select --id "${{ secrets.CE_PROJECT_ID }}"

      - name: Deploy or update Code Engine application
        env:
          IMAGE: ${{ env.ICR_REGION }}/${{ secrets.ICR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}
        run: |
          # Check if the application already exists
          if ibmcloud ce application get --name "${{ secrets.CE_APP_NAME }}" &>/dev/null; then
            echo "🔄 Updating existing Code Engine application..."
            ibmcloud ce application update \
              --name "${{ secrets.CE_APP_NAME }}" \
              --image "$IMAGE" \
              --registry-secret icr-secret \
              --env PORT=3000 \
              --env WATSONX_API_KEY="${{ secrets.WATSONX_API_KEY }}" \
              --env WATSONX_PROJECT_ID="${{ secrets.WATSONX_PROJECT_ID }}" \
              --env WATSONX_URL="${{ secrets.WATSONX_URL }}" \
              --env WATSONX_MODEL_ID="${{ secrets.WATSONX_MODEL_ID }}" \
              --wait
          else
            echo "🚀 Creating new Code Engine application..."
            ibmcloud ce application create \
              --name "${{ secrets.CE_APP_NAME }}" \
              --image "$IMAGE" \
              --registry-secret icr-secret \
              --env PORT=3000 \
              --env WATSONX_API_KEY="${{ secrets.WATSONX_API_KEY }}" \
              --env WATSONX_PROJECT_ID="${{ secrets.WATSONX_PROJECT_ID }}" \
              --env WATSONX_URL="${{ secrets.WATSONX_URL }}" \
              --env WATSONX_MODEL_ID="${{ secrets.WATSONX_MODEL_ID }}" \
              --port 3000 \
              --min-scale 1 \
              --max-scale 3 \
              --cpu 0.5 \
              --memory 1G \
              --wait
          fi

      - name: Print deployed URL
        run: |
          URL=$(ibmcloud ce application get --name "${{ secrets.CE_APP_NAME }}" \
                  --output json | python3 -c \
                  "import sys,json; d=json.load(sys.stdin); \
                   print(d.get('status',{}).get('url','URL not available'))")
          echo "✅ Deployed: $URL"
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App** | ${{ secrets.CE_APP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ needs.build-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | $URL |" >> $GITHUB_STEP_SUMMARY
